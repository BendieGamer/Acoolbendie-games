<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Actions Status Checker (Live)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0d1117, #161b22);
            padding: 40px;
            color: #c9d1d9;
        }
        .container {
            max-width: 1000px;
            background: #0d1117;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2, h3 { margin-top: 0; }
        label { font-weight: 600; margin-top: 14px; display: block; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
        }
        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #238636;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        #statusOutput {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .status-success { background: rgba(46,160,67,0.15); color: #3fb950; }
        .status-failure { background: rgba(248,81,73,0.15); color: #f85149; }
        .status-running { background: rgba(56,139,253,0.15); color: #58a6ff; }
        .log-panel {
            margin-top: 20px;
            background: #161b22;
            border-radius: 12px;
            padding: 16px;
            max-height: 450px;
            overflow: auto;
            font-size: 13px;
        }
        .job { margin-bottom: 16px; }
        .job-title { font-weight: 700; margin-bottom: 6px; }
        .step { padding-left: 14px; }
        .success { color: #3fb950; }
        .failure { color: #f85149; }
        .skipped { color: #8b949e; }
        .running { color: #58a6ff; }
        .file-explorer {
            margin-top: 24px;
            background: #161b22;
            border-radius: 12px;
            padding: 16px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .file-item:hover { background: #21262d; }
        .file-name { display: flex; gap: 8px; }
        .file-size { color: #8b949e; }
        .folder { color: #58a6ff; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <h2>GitHub Actions Status Checker (Live)</h2>

    <label>Repository Owner</label>
    <input id="owner">

    <label>Repository Name</label>
    <input id="repo">

    <label>Workflow File Name</label>
    <input id="workflow" placeholder="e.g. ci.yml">

    <label>GitHub Personal Access Token</label>
    <input id="pat" type="password">

    <button onclick="startMonitoring()">Check & Monitor Workflow</button>

    <div id="statusOutput">Status will appear here...</div>
    <div id="logOutput" class="log-panel"></div>

    <div class="file-explorer">
        <h3>Repository Files</h3>
        <div id="currentPath">/</div>
        <div id="fileList"></div>
    </div>
</div>

<script>
const ownerInput = document.getElementById('owner');
const repoInput = document.getElementById('repo');
const workflowInput = document.getElementById('workflow');
const patInput = document.getElementById('pat');
const statusOutput = document.getElementById('statusOutput');
const logOutput = document.getElementById('logOutput');

let poller = null;

/* -------- Local Storage -------- */
function saveInputs() {
    localStorage.setItem('gh_owner', ownerInput.value);
    localStorage.setItem('gh_repo', repoInput.value);
    localStorage.setItem('gh_workflow', workflowInput.value);
    localStorage.setItem('gh_pat', patInput.value);
}

function loadInputs() {
    ownerInput.value = localStorage.getItem('gh_owner') || '';
    repoInput.value = localStorage.getItem('gh_repo') || '';
    workflowInput.value = localStorage.getItem('gh_workflow') || '';
    patInput.value = localStorage.getItem('gh_pat') || '';
}

/* -------- Live Workflow Updates -------- */
async function startMonitoring() {
    saveInputs();
    if (poller) clearInterval(poller);
    await updateWorkflow();
    poller = setInterval(updateWorkflow, 5000);
}

async function updateWorkflow() {
    const owner = ownerInput.value.trim();
    const repo = repoInput.value.trim();
    const workflowFileName = workflowInput.value.trim();
    const pat = patInput.value.trim();

    try {
        const workflows = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows`, auth(pat)).then(r => r.json());
        const workflow = workflows.workflows.find(w => w.path.endsWith(`/${workflowFileName}`));
        if (!workflow) throw new Error('Workflow not found');

        const runs = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow.id}/runs?per_page=1`, auth(pat)).then(r => r.json());
        const run = runs.workflow_runs[0];

        const conclusion = run.conclusion ?? 'running';
        statusOutput.textContent = `Status: ${run.status} (${conclusion}) — live updating`;
        statusOutput.className = conclusion === 'success'
            ? 'status-success'
            : conclusion === 'failure'
            ? 'status-failure'
            : 'status-running';

        const jobs = await fetch(run.jobs_url, auth(pat)).then(r => r.json());
        logOutput.innerHTML = '';

        for (const job of jobs.jobs) {
            const jobDiv = document.createElement('div');
            jobDiv.className = 'job';
            jobDiv.innerHTML = `<div class="job-title">Job: ${job.name} (${job.conclusion ?? job.status})</div>`;
            for (const step of job.steps) {
                const state = step.conclusion ?? step.status;
                const stepDiv = document.createElement('div');
                stepDiv.className = `step ${state}`;
                stepDiv.textContent = `• ${step.name} — ${state}`;
                jobDiv.appendChild(stepDiv);
            }
            logOutput.appendChild(jobDiv);
        }

        if (run.status === 'completed' && poller) {
            clearInterval(poller);
            poller = null;
        }

        loadFiles('');
    } catch (err) {
        statusOutput.textContent = `Error: ${err.message}`;
        statusOutput.className = 'status-failure';
    }
}

function auth(token) {
    return { headers: { 'Authorization': `token ${token}` } };
}

/* -------- File Explorer -------- */
async function loadFiles(path = '') {
    const owner = ownerInput.value.trim();
    const repo = repoInput.value.trim();
    const pat = patInput.value.trim();

    document.getElementById('currentPath').textContent = '/' + path;
    const fileList = document.getElementById('fileList');
    fileList.innerHTML = 'Loading...';

    try {
        const files = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, auth(pat)).then(r => r.json());
        fileList.innerHTML = '';

        if (path) {
            const up = document.createElement('div');
            up.className = 'file-item folder';
            up.textContent = '⬅ ..';
            up.onclick = () => loadFiles(path.split('/').slice(0, -1).join('/'));
            fileList.appendChild(up);
        }

        files.forEach(f => {
            const row = document.createElement('div');
            row.className = 'file-item';
            row.innerHTML = `<div class="file-name ${f.type === 'dir' ? 'folder' : ''}">${f.type === 'dir' ? '📁' : '📄'} ${f.name}</div><div class="file-size">${f.size ? formatSize(f.size) : ''}</div>`;
            if (f.type === 'dir') row.onclick = () => loadFiles(f.path);
            fileList.appendChild(row);
        });
    } catch {
        fileList.innerHTML = 'Failed to load files';
    }
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

loadInputs();
</script>
</body>
</html>
