<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d14" />
    <meta
      name="description"
      content="BenSite Game Hub — free browser games, proxies and in-browser Minecraft. No sign-up, no install."
    />

    <link rel="icon" href="%PUBLIC_URL%/bendie_site_logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@300;400;600;700;900&family=Share+Tech+Mono&display=swap"
    />

    <title>Bendie Site</title>

    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // default accent. Storage can throw when the site runs inside a sandboxed
      // iframe (offline file / decoy tab), so failure must be silent.
      (function () {
        var THEMES = ["violet", "toxic", "cyber", "inferno", "rose", "mono"];
        var theme = "violet";
        try {
          var stored = window.localStorage.getItem("bendieTheme");
          if (stored && THEMES.indexOf(stored) !== -1) theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
